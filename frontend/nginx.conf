server {
    listen 80;
    root /usr/share/nginx/html;

    # nginx refuses bodies over 1 MB by default; photos may be up to 15 MB (the backend's limit,
    # which answers with a clearer message) plus the multipart overhead.
    client_max_body_size 16m;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location /files/ {
        proxy_pass http://backend:8000;
    }

    # Vite puts a hash of the content in these file names, so they never change in place.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
